<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title description">
  <title id="title">Raghav Agarwal · @raghammer1 — Build. Break. Understand. Repeat.</title>
  <desc id="description">Source code and experiments by Raghav Agarwal. Bold ivory lettering beside an abstract branching Git commit graph, in terracotta on black.</desc>
  <defs>
    <linearGradient id="branch" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#74533f"/>
      <stop offset="1" stop-color="#e99e70"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="340" rx="16" fill="#090c0d"/>

  <!-- The masthead anchors the artwork to this GitHub account. -->
  <g font-family="Arial, Helvetica, sans-serif" fill="#f5f0e7">
    <text x="44" y="39" font-size="20" font-weight="700" letter-spacing="2">RAGHAV AGARWAL</text>
    <text x="1156" y="39" font-size="19" text-anchor="end" fill="#e99e70">@raghammer1</text>
  </g>
  <path d="M44 61H1156" stroke="#30322f"/>

  <g font-family="Arial, Helvetica, sans-serif" font-size="67" font-weight="800" letter-spacing="-2.8" fill="#f5f0e7">
    <text x="40" y="133">BUILD. BREAK.</text>
    <text x="40" y="197">UNDERSTAND.</text>
    <text x="40" y="261" fill="#e99e70">REPEAT.</text>
  </g>

  <!-- A deliberately abstract Git graph: branches diverge and return to a shared history. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M749 179H1138" stroke="#e99e70" stroke-width="3"/>
    <path d="M806 179C843 179 828 115 870 115H1006C1048 115 1035 179 1072 179" stroke="url(#branch)" stroke-width="3"/>
    <path d="M873 179C910 179 895 243 936 243H1138" stroke="#929b91" stroke-width="2.5"/>
    <path d="M1003 243C1040 243 1027 179 1072 179" stroke="#929b91" stroke-width="2.5"/>
    <path d="M749 179H715M1138 179H1156M1138 243H1156" stroke="#43453e" stroke-width="2" stroke-dasharray="1 7"/>
  </g>
  <g fill="#090c0d" stroke="#e99e70" stroke-width="3">
    <circle cx="774" cy="179" r="8"/>
    <circle cx="873" cy="179" r="8"/>
    <circle cx="972" cy="179" r="8"/>
    <circle cx="887" cy="115" r="8"/>
    <circle cx="982" cy="115" r="8"/>
    <circle cx="1072" cy="179" r="8"/>
  </g>
  <g fill="#090c0d" stroke="#b3bdb0" stroke-width="2.5">
    <circle cx="950" cy="243" r="7"/>
    <circle cx="1096" cy="243" r="7"/>
  </g>
  <circle cx="1138" cy="179" r="11" fill="#e99e70"/>
  <circle cx="1138" cy="179" r="4" fill="#090c0d"/>

  <path d="M44 289H1156" stroke="#30322f"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="1.8">
    <text x="44" y="319" fill="#c6c4b9">SOURCE CODE &amp; EXPERIMENTS</text>
    <text x="1156" y="319" text-anchor="end" fill="#a4a79e">PYTHON · TYPESCRIPT · CURIOSITY</text>
  </g>
</svg>
