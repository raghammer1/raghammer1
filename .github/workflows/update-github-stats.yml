name: Refresh GitHub profile stats

on:
  schedule:
    - cron: '23 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-profile-stats
  cancel-in-progress: false

jobs:
  refresh:
    # Dispatches on unmerged feature branches must not publish to the profile.
    if: github.repository == 'raghammer1/raghammer1' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - name: Verify calculations and failure handling
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Generate cards from public GitHub data
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_github_stats.py
      - name: Commit refreshed assets
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- assets/github-*.svg assets/github-stats.json assets/github-stats.md
          if git diff --cached --quiet; then
            echo "Profile stats are already current."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh public GitHub profile stats'
          # Rebase onto any intervening changes. A conflict fails safely; never force-push.
          git fetch origin "$DEFAULT_BRANCH"
          git rebase "origin/$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
